license="${mod_license}"
issueTrackerURL="https://github.com/Duppy-Conqueror/LogicGate/issues" #optional

# Mod Properties
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_github}"
iconFile="assets/logic_gate/icon.png"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="${mod_id}.mixins.json"

# Dependencies
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cloth-config-neoforge"
type="optional"
versionRange="[${cloth_config_api_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="yet-another-config-lib"
type="optional"
versionRange="[${yacl_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[${jade_version},)"
ordering="NONE"
side="CLIENT"